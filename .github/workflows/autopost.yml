name: Trend Auto Post

on:
  schedule:
    # Wakes up every hour; the bot itself posts only once per peak slot (bot/config.py POST_SLOTS),
    # so a late or skipped GitHub cron run is caught up by the next hour.
    # Slots (UTC): 01 US prime time, 07 UK morning + Australia evening, 12 US morning + UK lunch,
    # 16 US noon, 19 US afternoon + UK evening, 23 US East evening
    - cron: "17 * * * *"
  workflow_dispatch:      # lets you press "Run workflow" manually
    inputs:
      dry_run:
        description: "Dry run? default = use the DRY_RUN variable, false = really post this one run"
        type: choice
        options: ["default", "true", "false"]
        default: "default"

permissions:
  contents: write

concurrency:
  group: trend-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PAGE_NAME: ${{ vars.PAGE_NAME }}
          NICHE: ${{ vars.NICHE }}
          COUNTRIES: ${{ vars.COUNTRIES }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
          AUTO_REPLY: ${{ vars.AUTO_REPLY }}
          DRY_RUN: ${{ (inputs.dry_run == 'true' || inputs.dry_run == 'false') && inputs.dry_run || vars.DRY_RUN }}
          RUN_MODE: ${{ inputs.dry_run }}
          AVOID_POLITICS: ${{ vars.AVOID_POLITICS }}
        run: python -m bot.main

      - name: Save posters (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posters
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "bot: update posted list" && git push)
